# Chay: docker compose up -d --build
# Can file .env o thu muc goc (copy tu .env.example).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: privatehire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: privatehire
    volumes:
      # Postgres 18 luu du lieu duoi /var/lib/postgresql/18/...
      - pgdata:/var/lib/postgresql
    ports:
      # Cong 5433 tren may -> 5432 trong container (5432 da dung cho Postgres cai tren may)
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privatehire -d privatehire"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # "db" la ten service o tren, khong phai localhost
      DATABASE_URL: postgresql+psycopg://privatehire:${POSTGRES_PASSWORD}@db:5432/privatehire
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"

volumes:
  pgdata:
